.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:8px;}

@keyframes spin{to{transform:rotate(360deg)}}

<script>
const BOOKS=[
{n:"創世記",t:"ot",c:50},{n:"出エジプト記",t:"ot",c:40},{n:"レビ記",t:"ot",c:27},{n:"民数記",t:"ot",c:36},{n:"申命記",t:"ot",c:34},
{n:"ヨシュア記",t:"ot",c:24},{n:"士師記",t:"ot",c:21},{n:"ルツ記",t:"ot",c:4},{n:"サムエル記上",t:"ot",c:31},{n:"サムエル記下",t:"ot",c:24},
{n:"列王記上",t:"ot",c:22},{n:"列王記下",t:"ot",c:25},{n:"歴代誌上",t:"ot",c:29},{n:"歴代誌下",t:"ot",c:36},{n:"エズラ記",t:"ot",c:10},
{n:"ネヘミヤ記",t:"ot",c:13},{n:"エステル記",t:"ot",c:10},{n:"ヨブ記",t:"ot",c:42},{n:"詩篇",t:"ot",c:150},{n:"箴言",t:"ot",c:31},
{n:"伝道の書",t:"ot",c:12},{n:"雅歌",t:"ot",c:8},{n:"イザヤ書",t:"ot",c:66},{n:"エレミヤ書",t:"ot",c:52},{n:"哀歌",t:"ot",c:5},
{n:"エゼキエル書",t:"ot",c:48},{n:"ダニエル書",t:"ot",c:12},{n:"ホセア書",t:"ot",c:14},{n:"ヨエル書",t:"ot",c:3},{n:"アモス書",t:"ot",c:9},
{n:"オバデヤ書",t:"ot",c:1},{n:"ヨナ書",t:"ot",c:4},{n:"ミカ書",t:"ot",c:7},{n:"ナホム書",t:"ot",c:3},{n:"ハバクク書",t:"ot",c:3},
{n:"ゼファニヤ書",t:"ot",c:3},{n:"ハガイ書",t:"ot",c:2},{n:"ゼカリヤ書",t:"ot",c:14},{n:"マラキ書",t:"ot",c:4},
{n:"マタイ",t:"nt",c:28},{n:"マルコ",t:"nt",c:16},{n:"ルカ",t:"nt",c:24},{n:"ヨハネ",t:"nt",c:21},{n:"使徒の働き",t:"nt",c:28},
{n:"ローマ",t:"nt",c:16},{n:"コリントI",t:"nt",c:16},{n:"コリントII",t:"nt",c:13},{n:"ガラテヤ",t:"nt",c:6},{n:"エペソ",t:"nt",c:6},
{n:"ピリピ",t:"nt",c:4},{n:"コロサイ",t:"nt",c:4},{n:"テサロニケI",t:"nt",c:5},{n:"テサロニケII",t:"nt",c:3},{n:"テモテI",t:"nt",c:6},
{n:"テモテII",t:"nt",c:4},{n:"テトス",t:"nt",c:3},{n:"ピレモン",t:"nt",c:1},{n:"ヘブル",t:"nt",c:13},{n:"ヤコブ",t:"nt",c:5},
{n:"ペテロI",t:"nt",c:5},{n:"ペテロII",t:"nt",c:3},{n:"ヨハネI",t:"nt",c:5},{n:"ヨハネII",t:"nt",c:1},{n:"ヨハネIII",t:"nt",c:1},
{n:"ユダ",t:"nt",c:1},{n:"黙示録",t:"nt",c:22}
];

const AVATAR_BG=['#E1F5EE','#E6F1FB','#FAEEDA','#FBEAF0','#EAF3DE','#EEEDFE'];
const AVATAR_TX=['#085041','#0C447C','#633806','#72243E','#27500A','#3C3489'];

let sb, myName='', myCode='', myId='', bookTab='all', activeBook=null, readData={};
const SK='bible_sb_v1';

function initSupabase(){
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
}

function makeId(){return crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now().toString(36);}
function makeCode(){return Math.random().toString(36).slice(2,8).toUpperCase();}
function colorIdx(name){let h=0;for(let i=0;i<name.length;i++)h=(h*31+name.charCodeAt(i))%AVATAR_BG.length;return h;}

function showAlert(msg,type){const el=document.getElementById('join-alert');el.textContent=msg;el.className='alert '+(type||'error');el.style.display='block';}

async function joinOrCreate(){
  const name=document.getElementById("inp-name").value.trim();
  const code=document.getElementById("inp-code").value.trim().toUpperCase();
  if(!name){showAlert("名前を入力してください。");return;}
  if(code&&code.length!==6){showAlert("グループコードは6文字です。");return;}
  const btn=document.getElementById("join-btn");
  btn.disabled=true;btn.textContent="処理中...";
  try{
    if(code){
      const res=await sb.from("groups").select("code").eq("code",code);
      if(res.error)throw new Error("グループ検索エラー: "+res.error.message);
      if(!res.data||res.data.length===0){showAlert("グループが見つかりません。コードを確認してください。");btn.disabled=false;btn.textContent="参加 / 新規作成";return;}
      myCode=code;
    } else {
      myCode=makeCode();
      const res=await sb.from("groups").insert({code:myCode});
      if(res.error)throw new Error("グループ作成エラー: "+res.error.message);
    }
    myName=name;
    myId=btoa(unescape(encodeURIComponent(myName+"_"+myCode))).replace(/[^a-zA-Z0-9]/g,"").slice(0,36);
    readData={};
    initRead();
    const existing=await sb.from("members").select("read_data").eq("id",myId);
    if(!existing.error&&existing.data&&existing.data.length>0&&existing.data[0].read_data){
      readData=existing.data[0].read_data;
    }
    const upsertRes=await sb.from("members").upsert({id:myId,group_code:myCode,name:myName,read_data:readData,updated_at:new Date().toISOString()});
    if(upsertRes.error)throw new Error("メンバー保存エラー: "+upsertRes.error.message);
    localStorage.setItem(SK,JSON.stringify({name:myName,code:myCode,id:myId,read:readData}));
    enterApp();
  }catch(e){showAlert("エラー: "+e.message);}
  btn.disabled=false;btn.textContent="参加 / 新規作成";
}

function initRead(){BOOKS.forEach(b=>{if(!readData[b.n])readData[b.n]=new Array(b.c).fill(false);});}
function totalRead(){return BOOKS.reduce((a,b)=>a+(readData[b.n]||[]).filter(Boolean).length,0);}
function bookRead(b){return(readData[b.n]||[]).filter(Boolean).length;}

function updateStats(){
  const r=totalRead(),p=Math.round(r/1189*100);
  document.getElementById('s-read').textContent=r;
  document.getElementById('s-pct').textContent=p+'%';
  document.getElementById('prog-txt').textContent=r+' / 1189 章';
  document.getElementById('prog-bar').style.width=p+'%';
}

async function saveProgress(){
  localStorage.setItem(SK,JSON.stringify({name:myName,code:myCode,id:myId,read:readData}));
  await sb.from('members').upsert({id:myId,group_code:myCode,name:myName,read_data:readData,updated_at:new Date().toISOString()});
}

function showTab(t){
  ['my','group','share'].forEach(x=>{
    document.getElementById('tab-'+x).classList.toggle('active',x===t);
    document.getElementById('pane-'+x).style.display=x===t?'block':'none';
  });
  if(t==='group')loadGroup();
}

async function loadGroup(){
  document.getElementById('group-loading').style.display='block';
  document.getElementById('group-list').style.display='none';
  const {data,error}=await sb.from('members').select('id,name,read_data').eq('group_code',myCode);
  const list=document.getElementById('members-list');
  list.innerHTML='';
  if(error||!data||data.length===0){
    list.innerHTML='<div style="font-size:13px;color:#666;padding:1rem 0;">まだメンバーがいません。グループコードを共有してください。</div>';
  } else {
    data.sort((a,b)=>{
      const ra=Object.values(a.read_data||{}).flat().filter(Boolean).length;
      const rb=Object.values(b.read_data||{}).flat().filter(Boolean).length;
      return rb-ra;
    }).forEach(m=>{
      const rd=Object.values(m.read_data||{}).flat().filter(Boolean).length;
      const pct=Math.round(rd/1189*100);
      const ci=colorIdx(m.name);
      const row=document.createElement('div');
      row.className='member-row';
      row.innerHTML=`
        <div class="avatar" style="background:${AVATAR_BG[ci]};color:${AVATAR_TX[ci]};">${m.name.slice(0,2)}</div>
        <div class="member-info">
          <div class="member-name">${m.name}${m.id===myId?'<span class="you-badge">あなた</span>':''}</div>
          <div class="member-pct">${rd} / 1189 章（${pct}%）</div>
          <div style="margin-top:5px;" class="bar-bg bar-sm"><div class="bar-fill bar-sm" style="width:${pct}%"></div></div>
        </div>`;
      list.appendChild(row);
    });
  }
  document.getElementById('group-loading').style.display='none';
  document.getElementById('group-list').style.display='block';
}

function setBookTab(t){
  bookTab=t;
  ['all','ot','nt'].forEach(x=>document.getElementById('btab-'+x).classList.toggle('active',x===t));
  renderBooks();
}

function renderBooks(){
  const q=(document.getElementById('bsearch').value||'').toLowerCase();
  const grid=document.getElementById('books-grid');
  grid.innerHTML='';
  let lastT='';
  BOOKS.filter(b=>{
    if(bookTab!=='all'&&b.t!==bookTab)return false;
    if(q&&!b.n.toLowerCase().includes(q))return false;
    return true;
  }).forEach(b=>{
    if(b.t!==lastT&&bookTab==='all'){
      const lbl=document.createElement('div');
      lbl.className='section-label';
      lbl.textContent=b.t==='ot'?'旧約聖書':'新約聖書';
      grid.appendChild(lbl);lastT=b.t;
    }
    const rd=bookRead(b),pct=Math.round(rd/b.c*100);
    const card=document.createElement('div');
    card.className='book-card'+(rd===b.c?' done':'');
    card.innerHTML=`<div class="book-name">${b.n}</div><div class="chap-bar-bg"><div class="chap-bar" style="width:${pct}%"></div></div><div class="book-meta">${rd} / ${b.c} 章</div>`;
    card.onclick=()=>openModal(b);
    grid.appendChild(card);
  });
}

function openModal(b){activeBook=b;document.getElementById('modal-title').textContent=b.n+'（'+b.c+'章）';renderChaps();document.getElementById('modal').classList.add('open');}
function renderChaps(){
  const b=activeBook,g=document.getElementById('chap-grid');
  g.innerHTML='';
  for(let i=1;i<=b.c;i++){
    const btn=document.createElement('button');
    btn.className='chap-btn'+((readData[b.n]||[])[i-1]?' read':'');
    btn.textContent=i;
    btn.onclick=()=>toggleChap(b,i-1);
    g.appendChild(btn);
  }
}
async function toggleChap(b,i){
  if(!readData[b.n])readData[b.n]=new Array(b.c).fill(false);
  readData[b.n][i]=!readData[b.n][i];
  updateStats();renderChaps();renderBooks();
  await saveProgress();
}
async function markAll(){const b=activeBook;readData[b.n]=new Array(b.c).fill(true);updateStats();renderChaps();renderBooks();await saveProgress();}
async function markNone(){const b=activeBook;readData[b.n]=new Array(b.c).fill(false);updateStats();renderChaps();renderBooks();await saveProgress();}
function closeModal(e,force){if(force||e.target===document.getElementById('modal'))document.getElementById('modal').classList.remove('open');}

function copyCode(){
  try{navigator.clipboard.writeText(myCode);}catch(e){}
  const btn=document.getElementById('copy-btn');
  btn.textContent='コピーしました！';setTimeout(()=>btn.textContent='コードをコピー',2000);
}

function logout(){localStorage.removeItem(SK);location.reload();}

function enterApp(){
  document.getElementById('screen-join').classList.remove('active');
  document.getElementById('screen-main').classList.add('active');
  const ci=colorIdx(myName);
  const av=document.getElementById('top-avatar');
  av.textContent=myName.slice(0,2);av.style.background=AVATAR_BG[ci];av.style.color=AVATAR_TX[ci];
  document.getElementById('top-name').textContent=myName;
  document.getElementById('disp-code').textContent=myCode;
  updateStats();renderBooks();
}

// 起動
initSupabase();
(async()=>{
  try{
    const saved=JSON.parse(localStorage.getItem(SK)||'null');
    if(saved&&saved.name&&saved.code&&saved.id){
      myName=saved.name;myCode=saved.code;myId=saved.id;
      const res=await sb.from('members').select('read_data').eq('id',myId);
      if(!res.error&&res.data&&res.data.length>0&&res.data[0].read_data){
        readData=res.data[0].read_data;
      } else {
        readData=saved.read||{};
      }
      initRead();enterApp();
    }
  }catch(e){console.error('起動エラー:',e);}
})();
</script>
